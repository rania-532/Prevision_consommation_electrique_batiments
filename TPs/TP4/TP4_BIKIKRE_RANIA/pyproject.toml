# Fiche d'identité du package maintai : lue par pip install et par python -m build
[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "maintai"
dynamic = ["version"]  # lue dans maintai/__init__.py (voir plus bas)
description = "Package Python de prédiction des pannes d'équipements industriels à partir de données de capteurs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "scikit-learn>=1.8.0",
    "joblib>=1.5.3",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
ui = ["streamlit>=1.40"]
dev = ["pytest>=8", "ruff"]

# TODO TP4 sprint 1 : [project.scripts]
[project.scripts]
maintai-predict = "maintai.cli:main"

[tool.setuptools.dynamic]
version = {attr = "maintai.__version__"}

[tool.setuptools.packages.find]
include = ["maintai*"]  # seul le dossier maintai/ entre dans le package
